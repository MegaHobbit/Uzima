spring.application.name=Uzima
server.port=8600
# DATASOURCE
spring.datasource.url=jdbc:postgresql://localhost:5432/uzima_hospital?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection Pool
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.leak-detection-threshold=30000
#Task Scheduling
spring.task.scheduling.pool.size=2
# JPA/HIBERNATE
spring.jpa.database=postgresql
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Nairobi
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# API Documentation path
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
#SWAGGER
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Swagger UI Configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
#Email Sandbox by MailTrap Config
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
